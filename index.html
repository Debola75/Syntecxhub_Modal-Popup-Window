<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Get in touch</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 18% 18%, rgb(101 117 255 / 12%), transparent 34rem),
        radial-gradient(ellipse at 88% 82%, rgb(53 195 173 / 10%), transparent 30rem),
        #f5f7fb;
    }

    .card {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid #e8ebf3;
      border-radius: 28px;
      background: rgb(255 255 255 / 90%);
      box-shadow: 0 24px 80px rgb(34 45 80 / 9%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: #5c66da;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      letter-spacing: -0.055em;
      line-height: 1.05;
    }

    .intro {
      max-width: 430px;
      margin: 20px auto 30px;
      color: #657087;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    button {
      font: inherit;
    }

    .open-button,
    .submit-button {
      min-height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: #535fe0;
      box-shadow: 0 9px 20px rgb(83 95 224 / 24%);
      cursor: pointer;
      font-weight: 700;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .open-button:hover,
    .submit-button:hover {
      background: #424ec9;
      box-shadow: 0 12px 24px rgb(83 95 224 / 30%);
      transform: translateY(-2px);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #9ca5ff;
      outline-offset: 3px;
    }

    .modal {
      width: min(100% - 32px, 480px);
      max-width: none;
      max-height: min(90vh, 760px);
      padding: 0;
      overflow: auto;
      border: 1px solid rgb(255 255 255 / 70%);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 30px 100px rgb(12 18 42 / 28%);
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      transition: opacity 220ms ease, transform 220ms ease, overlay 220ms allow-discrete, display 220ms allow-discrete;
    }

    .modal[open] {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .modal.is-closing {
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      pointer-events: none;
    }

    @starting-style {
      .modal[open] {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
    }

    .modal::backdrop {
      background: rgb(16 22 42 / 48%);
      opacity: 0;
      transition: opacity 220ms ease, overlay 220ms allow-discrete, display 220ms allow-discrete;
    }

    .modal[open]::backdrop {
      opacity: 1;
    }

    @starting-style {
      .modal[open]::backdrop {
        opacity: 0;
      }
    }

    .modal.is-closing::backdrop {
      opacity: 0;
    }

    .modal-content {
      padding: clamp(24px, 6vw, 38px);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.65rem;
      letter-spacing: -0.04em;
    }

    .modal-header p {
      margin: 8px 0 0;
      color: #68738a;
      line-height: 1.55;
    }

    .close-button {
      display: grid;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 12px;
      color: #59647a;
      background: #f1f3f8;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      transition: background 160ms ease, color 160ms ease;
    }

    .close-button:hover {
      color: #172033;
      background: #e7eaf2;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #303a50;
      font-size: 0.9rem;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dfe3ed;
      border-radius: 12px;
      color: #172033;
      background: #fbfcfe;
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus,
    textarea:focus {
      border-color: #7c86ee;
      box-shadow: 0 0 0 3px rgb(124 134 238 / 14%);
      outline: 0;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      margin-top: 4px;
    }

    .success-message {
      margin: 16px 0 0;
      color: #18774c;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .success-message:empty {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">A little conversation goes a long way</p>
    <h1>Have something in mind?</h1>
    <p class="intro">Tell us what you’re working on. We’d love to hear from you and will get back to you soon.</p>
    <button class="open-button" id="open-modal" type="button">Send us a message</button>
  </main>

  <dialog class="modal" id="contact-modal" aria-labelledby="modal-title" aria-describedby="modal-description">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="modal-title">Let’s talk</h2>
          <p id="modal-description">Share a few details and we’ll be in touch.</p>
        </div>
        <button class="close-button" id="close-modal" type="button" aria-label="Close dialog">&times;</button>
      </div>
      <form id="contact-form">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Alex Morgan" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="alex@example.com" required>
        </div>
        <div class="field">
          <label for="message">How can we help?</label>
          <textarea id="message" name="message" placeholder="Tell us a little about your project..." required></textarea>
        </div>
        <button class="submit-button" type="submit">Send message</button>
        <p class="success-message" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </dialog>

  <script>
    const modal = document.querySelector("#contact-modal");
    const openButton = document.querySelector("#open-modal");
    const closeButton = document.querySelector("#close-modal");
    const form = document.querySelector("#contact-form");
    const formStatus = document.querySelector("#form-status");
    let closeTimer;

    function openModal() {
      window.clearTimeout(closeTimer);
      modal.classList.remove("is-closing");
      modal.showModal();
      formStatus.textContent = "";
      document.querySelector("#name").focus();
    }

    function closeModal() {
      if (!modal.open || modal.classList.contains("is-closing")) {
        return;
      }

      modal.classList.add("is-closing");
      closeTimer = window.setTimeout(() => {
        if (modal.open) {
          modal.close();
        }
      }, 230);
    }

    openButton.addEventListener("click", openModal);
    closeButton.addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });
    modal.addEventListener("cancel", (event) => {
      event.preventDefault();
      closeModal();
    });
    modal.addEventListener("close", () => {
      modal.classList.remove("is-closing");
      openButton.focus();
    });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      formStatus.textContent = "Thanks! Your message is ready to be sent.";
      form.reset();
    });
  </script>
</body>
</html>
